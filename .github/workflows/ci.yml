name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

  test:
    name: Component Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Run Vitest
        run: npm run test

  storybook:
    name: Storybook (build, story tests, a11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Install Chromium for the story tests
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      # Every story renders in Chromium against the mock API: a story that
      # throws, fails its play function, calls an unmocked endpoint or breaks
      # an accessibility rule fails the run.
      - name: Run story tests
        run: npm run test:storybook

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, storybook, build]
    steps:
      - run: echo "All CI checks passed"
