name: Deploy

# Builds the SPA for one environment and publishes it to that environment's
# bucket behind CloudFront. The bundle is built per environment because the
# API URLs and the Clerk key are compiled into it, so what is promoted from
# staging to production is the commit, not the build.
#
# - Staging deploys on every push to `stage`.
# - Production deploys a release: pushing a `vX.Y.Z` tag on `main` builds and
#   publishes the tagged commit (after the `production` environment's
#   approval, if it has reviewers), then publishes a GitHub Release with notes
#   since the previous one.
# - Run by hand, `release` takes a tag (redeploy or roll back to it) or, in an
#   emergency, a full commit SHA. Blank deploys the head of `stage` to
#   staging; production always needs one.
on:
  push:
    branches: [stage]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        required: true
      release:
        description: Release tag (vX.Y.Z) or full commit SHA; blank = head of stage (staging only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || (github.ref_type == 'tag' && 'production') || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  DEPLOY_ENV: ${{ inputs.environment || (github.ref_type == 'tag' && 'production') || 'staging' }}
  RELEASE: ${{ inputs.release || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.release || (github.ref_type == 'tag' && github.ref_name) || '' }} to ${{ inputs.environment || (github.ref_type == 'tag' && 'production') || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_type == 'tag' && 'production') || 'staging' }}
    outputs:
      release: ${{ steps.choose.outputs.release }}
    steps:
      - name: Validate inputs and configuration
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          BUCKET: ${{ vars.SPA_BUCKET }}
          DISTRIBUTION: ${{ vars.SPA_DISTRIBUTION_ID }}
          CORE_API: ${{ vars.VITE_CORE_API_URL }}
          EVENTS_API: ${{ vars.VITE_EVENTS_API_URL }}
          CLERK_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          [[ "$DEPLOY_ENV" =~ ^(staging|production)$ ]] || { echo "::error::unknown environment '$DEPLOY_ENV'"; exit 1; }
          [[ -z "$RELEASE" || "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::release must be a tag like v1.2.3 or a full 40-char commit SHA, got '$RELEASE'"; exit 1; }
          [[ "$DEPLOY_ENV" == staging || -n "$RELEASE" ]] || { echo "::error::production deploys a release: give a vX.Y.Z tag (or, in an emergency, a commit SHA)"; exit 1; }
          missing=()
          [[ -n "$KEY_ID" ]] || missing+=(secret:AWS_ACCESS_KEY_ID)
          for v in BUCKET DISTRIBUTION CORE_API EVENTS_API CLERK_KEY; do [[ -n "${!v}" ]] || missing+=("var:$v"); done
          [[ ${#missing[@]} -eq 0 ]] || { echo "::error::GitHub environment '$DEPLOY_ENV' is missing ${missing[*]}; see README → Deploying"; exit 1; }

          # Clerk loads its own scripts from the host encoded in the key (base64 of
          # "<host>$"), so a placeholder or truncated key builds fine and only fails in
          # the browser. Staging uses the development instance, production the live one.
          prefix=pk_test_
          [[ "$DEPLOY_ENV" == production ]] && prefix=pk_live_
          [[ "$CLERK_KEY" == "$prefix"* ]] || { echo "::error::VITE_CLERK_PUBLISHABLE_KEY must start with $prefix for $DEPLOY_ENV"; exit 1; }
          encoded=${CLERK_KEY#"$prefix"}
          while (( ${#encoded} % 4 )); do encoded+='='; done
          decoded=$(printf '%s' "$encoded" | base64 -d 2>/dev/null) || decoded=
          [[ "$decoded" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+\$$ ]] || { echo "::error::VITE_CLERK_PUBLISHABLE_KEY does not decode to a Clerk host; copy the whole Publishable key from the Clerk dashboard"; exit 1; }
          echo "Clerk frontend API: ${decoded%\$}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # COMMIT is what gets built: the tagged commit for a release.
      - name: Choose the commit
        id: choose
        env:
          PUSHED: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.sha || '' }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          git fetch --quiet origin main stage 2>/dev/null || git fetch --quiet origin main
          tag=
          if [[ "$RELEASE" =~ ^v ]]; then
            tag=$RELEASE
            commit=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}") \
              || { echo "::error::no tag $tag in this repository"; exit 1; }
          elif [[ -n "$RELEASE" ]]; then
            commit=$RELEASE
          elif [[ -n "$PUSHED" ]]; then
            commit=$PUSHED
          else
            commit=$(git rev-parse origin/stage)
          fi
          git checkout --quiet --detach "$commit"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "release=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying ${tag:+$tag → }\`$commit\` — $(git log -1 --format=%s "$commit")"

      # Production only runs what has been promoted to main. Staging runs
      # release candidates from stage, or a hotfix already on main.
      - name: Check the commit is on a release branch
        run: |
          on() { git rev-parse --verify --quiet "origin/$1" >/dev/null && git merge-base --is-ancestor "$COMMIT" "origin/$1"; }
          if [[ "$DEPLOY_ENV" == production ]]; then
            on main || { echo "::error::$COMMIT is not on main; promote stage to main with a merge commit first"; exit 1; }
          else
            on stage || on main || { echo "::error::$COMMIT is on neither stage nor main"; exit 1; }
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Build for ${{ env.DEPLOY_ENV }}
        env:
          VITE_CORE_API_URL: ${{ vars.VITE_CORE_API_URL }}
          VITE_EVENTS_API_URL: ${{ vars.VITE_EVENTS_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONCIERGE_WHATSAPP_NUMBER: ${{ vars.VITE_CONCIERGE_WHATSAPP_NUMBER }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets first and cached for good, then the entry files, which
      # must always be revalidated so a release shows up on the next load.
      # Old assets are kept: a tab still running the previous release may
      # lazy-load one of its chunks after this deploy.
      - name: Publish to the bucket
        env:
          BUCKET: ${{ vars.SPA_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync dist "s3://$BUCKET" --exclude 'assets/*' --delete \
            --cache-control 'no-cache'

      - name: Invalidate the CDN
        env:
          DISTRIBUTION: ${{ vars.SPA_DISTRIBUTION_ID }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
          echo "### Deployed ${RELEASE_TAG:+$RELEASE_TAG (}\`$COMMIT\`${RELEASE_TAG:+)} to $DEPLOY_ENV" >> "$GITHUB_STEP_SUMMARY"

  # Published only once production serves the release, so the Releases page
  # lists what production actually ran.
  publish-release:
    name: Publish GitHub Release ${{ needs.deploy.outputs.release }}
    needs: deploy
    if: needs.deploy.outputs.release != '' && (inputs.environment || (github.ref_type == 'tag' && 'production') || 'staging') == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release, unless it already exists (a redeploy)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.deploy.outputs.release }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
